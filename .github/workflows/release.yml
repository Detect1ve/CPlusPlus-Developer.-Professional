name: 'C++ CI'

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - feature/github_actions

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: GCC-Release
            compiler: gcc
            c_compiler: gcc-14
            cpp_compiler: g++-14
            build_dir: build-gcc-release
            build_type: Release
            install_compiler: true
            build_packages: true
          - os: ubuntu-latest
            name: GCC-Debug
            compiler: gcc
            c_compiler: gcc-14
            cpp_compiler: g++-14
            build_dir: build-gcc-debug
            build_type: Debug
            install_compiler: true
          - os: ubuntu-latest
            name: GCC-MinSizeRel
            compiler: gcc
            c_compiler: gcc-14
            cpp_compiler: g++-14
            build_dir: build-gcc-minsizerel
            build_type: MinSizeRel
            install_compiler: true
          - os: ubuntu-latest
            name: Clang-Release
            compiler: clang
            c_compiler: clang
            cpp_compiler: clang++
            build_dir: build-clang-release
            build_type: Release
          - os: ubuntu-latest
            name: Clang-Debug
            compiler: clang
            c_compiler: clang
            cpp_compiler: clang++
            build_dir: build-clang-debug
            build_type: Debug
          - os: ubuntu-latest
            name: Clang-MinSizeRel
            compiler: clang
            c_compiler: clang
            cpp_compiler: clang++
            build_dir: build-clang-minsizerel
            build_type: MinSizeRel
          - os: windows-latest
            name: MSVC-Release
            build_dir: build-msvc-release
            build_type: Release
            c_compiler: cl
            cpp_compiler: cl
          - os: windows-latest
            name: MSVC-Debug
            build_dir: build-msvc-debug
            build_type: Debug
            c_compiler: cl
            cpp_compiler: cl
          - os: windows-latest
            name: MSVC-MinSizeRel
            build_dir: build-msvc-minsizerel
            build_type: MinSizeRel
            c_compiler: cl
            cpp_compiler: cl
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
      - name: Install CMake
        if: runner.os == 'Linux'
        run: |
          wget -qO- "https://cmake.org/files/v4.2/cmake-4.2.3-linux-x86_64.tar.gz" | sudo tar --strip-components=1 -xz -C /usr/local
      - name: Install GCC
        if: matrix.install_compiler
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.cpp_compiler }}
      - name: Setup MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - shell: bash
        run: |
          cmake -G Ninja \
            -B ${{ matrix.build_dir }} \
            -D PATCH_VERSION=${{ github.run_number }} \
            -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -D CMAKE_C_COMPILER=${{ matrix.c_compiler }} \
            -D CMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
      - run: cmake --build ${{ matrix.build_dir }}
      - run: cmake --build ${{ matrix.build_dir }} --target test
      - if: matrix.build_packages && github.event_name == 'push'
        run: cmake --build ${{ matrix.build_dir }} --target package
      - name: Upload artifacts
        if: matrix.build_packages && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: ${{ matrix.build_dir }}/helloworld-0.0.${{ github.run_number }}-Linux.deb

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: build
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-artifacts
      - id: get_path
        name: Get package relative path
        run: echo "package_path=$(find release-artifacts -name helloworld-0.0.${{ github.run_number }}-Linux.deb | head -n 1)" >> "$GITHUB_OUTPUT"
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.run_number }}
          release_name: Release ${{ github.run_number }}
          draft: false
          prerelease: false
      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.get_path.outputs.package_path }}
          asset_name: helloworld-0.0.${{ github.run_number }}-Linux.deb
          asset_content_type: application/vnd.debian.binary-package
